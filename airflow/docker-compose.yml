version: '3.8'

# =============================================================================
# QIS System - Airflow 配置
# Python 3.12 + Airflow 2.8
# =============================================================================

x-airflow-common:
  &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'qis-system-secret-key-change-in-production'

    # 项目相关环境变量
    PYTHONPATH: /opt/airflow:/opt/qis_system
    QIS_CONFIG_PATH: /opt/qis_system/config
    QIS_AIRFLOW_MODE: 'true'

    # 数据库连接（复用项目配置）
    DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/qis_system}
    TONGLIAN_HOST: ${TONGLIAN_HOST:-192.168.27.112}
    TONGLIAN_PORT: ${TONGLIAN_PORT:-3306}
    TONGLIAN_DB: ${TONGLIAN_DB:-datayesdb}
    TONGLIAN_USER: ${TONGLIAN_USER:-user}
    TONGLIAN_PASSWORD: ${TONGLIAN_PASSWORD:-password}

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../config:/opt/qis_system/config
    - ../data:/opt/qis_system/data
    - ../database:/opt/qis_system/database
    - ../scripts:/opt/qis_system/scripts
    - ../requirements.txt:/opt/qis_system/requirements.txt

  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 避免与项目PostgreSQL冲突

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@qis.local || true
        echo "Airflow initialized successfully"

volumes:
  postgres-db-volume:
